model:
  vocab_size: 100
  num_layers: 12
  num_heads: 24
  embed_dim: 1536
  dropout: 0.0
  max_seq_len: 256
  ffn:
    type: swiglu
    activation: silu
    dim: 6144
    bias: false
  attention:
    use_rope: true
    dropout: 0.0
    rope:
      base: 10000
  layernorm:
    bias: true
    eps: 1.0e-5
  
train:
  model_device: cuda
  precision: bf16
  batch_size: 100
  log_interval: 10
  max_steps: 1000

optimizer:
  name: AdamW
  AdamW:
    lr: 1e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
    eps: 1e-8
  SGD:
    lr: 1e-3
    weight_decay: 0.0

scheduler:
  name: cosine
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  

regularization:
  grad_clip_norm: 1.0

loss:
  name: cross_entropy
  ignore_idx: -1


init:
  embedding:
    method: normal
    std: 0.02
  
  
  transformer_block:
    layer_norm:
      gamma:
        method: ones
      beta:
        method: zeros
    
    attention:
      qkv_linear:
        weight:
          method: normal
          std: 0.02
        bias:
          method: zeros

      out_linear:
        weight:
          method: normal
          std: 0.02
        bias:
          method: zeros
        
    ffn:
      linear1:
        weight:
          method: normal
          std: 0.02
        bias:
          method: zeros
        
      linear2:
        weight:
          method: normal
          std: 0.02
        bias:
          method: zeros